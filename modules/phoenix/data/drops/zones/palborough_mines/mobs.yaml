# Remove Snapping Mole, added to Copper Quadav and Old Quadav in the March 23, 2010 update.
# Source: https://www.playonline.com/pcd/verup/ff11us/detail/5338/detail.html

templates:
  Copper_Quadav:
    loot:
      drops:
        - chance: rare
          item:   palborough_chest_key
        - chance: rare
          item:   darksteel_engraving
        - chance: very_rare
          item:   brass_subligar
        - chance: very_rare
          item:   brass_cap
        - chance: very_rare
          item:   brass_leggings
        - chance: very_rare
          item:   brass_mittens
  Old_Quadav:
    loot:
      drops:
        - chance: rare
          item:   palborough_chest_key
        - chance: very_rare
          item:   brass_subligar
        - chance: very_rare
          item:   brass_cap
        - chance: very_rare
          item:   brass_leggings
        - chance: very_rare
          item:   brass_mittens
        - chance: uncommon
          one_of: [quadav_fetich_arms, quadav_fetich_legs, quadav_fetich_head, quadav_fetich_torso]

  Amethyst_Quadav:
    loot:
      drops:
        - chance: common
          item:   quadav_backplate
        - chance: uncommon
          one_of:
            - scroll_of_paralyze
            - scroll_of_protectra
            - scroll_of_barsleep
            - scroll_of_sneak
        - chance: very_rare
          item:   cuffs
        - chance: very_rare
          item:   ash_clogs
        - chance: very_rare
          item:   circlet
        - chance: very_rare
          item:   slops
