# Era mob layout for bhaflau_thickets.
# Needs the Era DATs (https://github.com/phoenixffxi/Era-DATs) or the client shows the wrong mob names.

# Remove Moblin Oil (June 17, 2014) and Puppetmaster's Testimony from the trolls it was added to (June 14, 2012).
# Moblin Oil: https://forum.square-enix.com/ffxi/threads/42614
# Puppetmaster's Testimony: https://forum.square-enix.com/ffxi/threads/24155
# Pre-2012 droppers (Troll Surveillant, Troll Engraver): https://wiki.ffo.jp/html/14495.html

templates:
  Troll_Sabreur:
    loot:
      drops:
        - chance: rare
          item:   halvung_brass_key
        - chance: very_rare
          item:   troll_pauldron
  Troll_Shieldbearer:
    loot:
      drops:
        - chance: rare
          item:   halvung_brass_key
        - chance: very_rare
          item:   troll_vambrace
  Troll_Surveillant:
    loot:
      drops:
        - chance: uncommon
          item:   puppetmasters_testimony
        - chance: rare
          item:   halvung_brass_key
        - chance: very_rare
          item:   troll_pauldron

  # -- Custom templates for mobs the core file lacks, scaffolded from the module's mob_groups/mob_pools inserts --

  Wivre:
    id:            5648
    display_name:  Wivre_past
    species:       wivre
    skill_list_id: 257
    attributes:
      combat:
        skill: axe
      jobs: [war, war]
      render:
        look:
          type:  standard
          model: 2233
        entity_flags: 131
        model_size:     1
        hitbox:        30
      behaviors:
        flags: [no_turn]
      spawn:
        respawn: 300
    loot:
      drops:
        - chance: common
          item:   bugard_skin
        - chance: very_rare
          item:   bugard_tusk
        - chance: rare
          item:   high-quality_bugard_skin
      despoil:
        bugard_skin: 0
        bugard_tusk: 0

