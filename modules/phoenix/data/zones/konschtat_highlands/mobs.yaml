# Source: https://forum.square-enix.com/ffxi/threads/38100
# Slots replace the core list whole, so every slot in the zone is restated.

# Remove Bee Pollen, added to Huge Wasps on May 14, 2015.
# Source: https://forum.square-enix.com/ffxi/threads/46976

templates:
  Forger:
    attributes:
      stats:
        hp: 2000
  Huge_Wasp:
    loot:
