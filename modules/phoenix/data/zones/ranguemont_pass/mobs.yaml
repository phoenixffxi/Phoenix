# Drops removed from mob loot after the Abyssea era: the Sky NM stone drops (December 7, 2010) and later targeted removals.
# Source: https://www.bg-wiki.com/ffxi/Version_Update_(12/06/2010)
# Source: https://www.bg-wiki.com/ffxi/Version_Update_(07/23/2012)

# Era mob layout for ranguemont_pass.
# Needs the Era DATs (https://github.com/phoenixffxi/Era-DATs) or the client shows the wrong mob names.

# Restores the pre-November 5, 2013 lottery cooldown for Hyakume.
# Source: https://forum.square-enix.com/ffxi/threads/38100
# Slots replace the core list whole, so every slot in the zone is restated.

# Remove Refresh II, introduced September 9, 2010. JP Wiki says it is very_common but not guaranteed.
# Source: https://www.playonline.com/pcd/verup/ff11us/detail/5835/detail.html

