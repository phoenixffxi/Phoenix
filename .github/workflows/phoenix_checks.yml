# Phoenix's pull request builds and tests, run instead of the Build and Test jobs in pr_checks.yml, plus Lua and data checks for modules/.
# They're in a separate file so upstream changes to pr_checks.yml merge without conflicts.
# Some upstream tests fail under Phoenix's era settings, so xi_test skips them (see tools/ci/phoenix/README.md).

name: Phoenix Checks

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
  # A manual run tests everything, like the weekly LSB update PR (see tools/ci/phoenix/run_xi_test.py).
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read
  checks: write
  pull-requests: write
  actions: read
  statuses: write

jobs:
  # One job per build: a job that needs a matrix job waits for every leg of it.
  Build_Windows:
    name: Build
    uses: ./.github/workflows/runner_build.yml
    with:
      runner: windows-2025
      compiler: msvc
      build_type: Debug
      build_modules: false
      upload_artifact: true

  Build_Linux:
    name: Build
    uses: ./.github/workflows/runner_build.yml
    with:
      runner: ubuntu-26.04
      compiler: gcc
      compiler_version: 15
      build_type: Debug
      build_modules: false
      upload_artifact: true

  # Compile check only: artifact names don't include the compiler, so uploading would clash with the gcc build.
  Build_Clang:
    name: Build
    uses: ./.github/workflows/runner_build.yml
    with:
      runner: ubuntu-26.04
      compiler: clang
      compiler_version: 22
      build_type: Debug
      build_modules: false
      upload_artifact: false

  Test_Windows:
    needs: Build_Windows
    if: ${{ !cancelled() && needs.Build_Windows.result == 'success' }}
    name: Test
    uses: ./.github/workflows/runner_test.yml
    with:
      runner: windows-2025
      # The build jobs above upload to this run, manual runs included.
      same_run_artifact: true
      test_modules: false
      multi_process: true
      xi_test: false
      startup_checks: true

  Test_Linux:
    needs: Build_Linux
    if: ${{ !cancelled() && needs.Build_Linux.result == 'success' }}
    name: Test
    uses: ./.github/workflows/runner_test.yml
    with:
      runner: ubuntu-26.04
      # The build jobs above upload to this run, manual runs included.
      same_run_artifact: true
      test_modules: false
      multi_process: false
      xi_test: true
      startup_checks: true

  # LuaLS on modules/ only, with scripts/ loaded for its definitions; pr_checks.yml's job checks scripts/.
  Module_Lua:
    name: Module Lua
    runs-on: ubuntu-latest
    container:
      image: ${{ vars.DEVTOOLS_IMAGE || 'ghcr.io/landsandboat/devtools:ubuntu' }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 2

      # The container's user doesn't own the checkout, so git ignores the repo until it's marked safe.
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      # Every module file init.txt enables needs a test, or an entry in tools/ci/phoenix/module_test_exemptions.md.
      - name: Check module test coverage
        run: python ./tools/ci/phoenix/module_test_coverage.py

      # A scripts/ change can break a module too.
      - name: Check for Lua changes
        id: changed
        run: |
          changed=$(git diff --name-only HEAD^1 HEAD)
          if grep -qE '^(modules|scripts)/.*\.lua$|^modules/init\.txt$|^\.vscode/settings\.json$|^tools/ci/phoenix/check_module_lua\.py$' <<< "$changed"; then
            echo "lua=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install Python dependencies
        if: steps.changed.outputs.lua == 'true'
        run: python -m pip install --upgrade -r ./tools/requirements.txt

      - name: Generate codegen Lua enums
        if: steps.changed.outputs.lua == 'true'
        run: python -m tools.codegen "$RUNNER_TEMP/codegen-out"

      - name: Run Lua Language Server on modules
        if: steps.changed.outputs.lua == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python ./tools/ci/phoenix/check_module_lua.py

  # Module data patches merged onto data/ the way the server loads them, and formatting for changed module YAML.
  Module_Data:
    name: Module data
    runs-on: ubuntu-latest
    container:
      image: ${{ vars.DEVTOOLS_IMAGE || 'ghcr.io/landsandboat/devtools:ubuntu' }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 2

      # The container's user doesn't own the checkout, so git ignores the repo until it's marked safe.
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      # An LSB data change can break a module patch too.
      - name: Check for data changes
        id: changed
        run: |
          changed=$(git diff --name-only HEAD^1 HEAD)
          if grep -qE '^(data/|tools/codegen/|src/map/data/|src/common/enum_traits\.h$|modules/init\.txt$|modules/[^/]+/data/|tools/ci/validate_module_data\.py$)|CMakeLists\.txt$' <<< "$changed"; then
            echo "validate=true" >> "$GITHUB_OUTPUT"
          fi
          present=$(git diff --name-only --diff-filter=d HEAD^1 HEAD)
          yaml=$(grep -E '^modules/[^/]+/data/.*\.ya?ml$' <<< "$present" | tr '\n' ' ' || true)
          echo "yaml=$yaml" >> "$GITHUB_OUTPUT"

      - name: Install Python dependencies
        if: steps.changed.outputs.validate == 'true' || steps.changed.outputs.yaml != ''
        run: python -m pip install --upgrade -r ./tools/requirements.txt

      - name: Check module YAML formatting
        if: steps.changed.outputs.yaml != ''
        env:
          YAML_FILES: ${{ steps.changed.outputs.yaml }}
        run: python tools/yaml/format.py $YAML_FILES --check

      # The next three steps match pr_checks.yml's Data validation job.
      - name: Restore CPM source cache
        if: steps.changed.outputs.validate == 'true'
        uses: actions/cache/restore@v5
        with:
          path: .cpm-cache
          key: cpm-${{ runner.os }}-${{ hashFiles('CMakeLists.txt', 'cmake/**', 'ext/CMakeLists.txt') }}
          restore-keys: cpm-${{ runner.os }}-

      - name: Configure schema compiler
        if: steps.changed.outputs.validate == 'true'
        run: |
          echo "CPM_SOURCE_CACHE=$GITHUB_WORKSPACE/.cpm-cache" >> "$GITHUB_ENV"
          export CPM_SOURCE_CACHE="$GITHUB_WORKSPACE/.cpm-cache"
          cmake -G Ninja -S . -B build-data-schema \
            -DCMAKE_BUILD_TYPE=Release \
            -DPCH_ENABLE=OFF \
            -DTRACY_ENABLE=OFF

      - name: Generate data schemas
        if: steps.changed.outputs.validate == 'true'
        run: cmake --build build-data-schema --target data_schema_check

      - name: Validate module data
        if: steps.changed.outputs.validate == 'true'
        run: python -m tools.ci.validate_module_data
